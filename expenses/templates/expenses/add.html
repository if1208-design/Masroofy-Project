{% extends 'expenses/base.html' %}

{% block content %}

<h2>Add Expense</h2>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <input type="number" name="amount" placeholder="Amount">
    <input type="text" name="category" placeholder="Category">
    <button type="submit">Save</button>
</form>

{% endblock %}
