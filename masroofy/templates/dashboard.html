
{% extends 'base.html' %}
{% include "navbar.html" %}

{% block content %}

{% if warning %}
<div class="alert alert-warning">
    {{ warning }}
</div>
{% endif %}

<div class="container">

    <div class="card">
        <h3>Daily Limit</h3>
        <p>{{ daily }}</p>
    </div>

    <div class="card">
        <h3>Spent</h3>
        <p>{{ spent }}</p>
    </div>

    <div class="card">
        <h3>Remaining</h3>
        <p>{{ remaining }}</p>
    </div>

</div>

{% endblock %}
