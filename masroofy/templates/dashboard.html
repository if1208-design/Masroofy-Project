{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="card">
        <h3>Daily Limit</h3>
        <p>{{ daily }}</p>
    </div>

    <div class="card">
        <h3>Spent</h3>
        <p>{{ spent }}</p>
    </div>

    <div class="card">
        <h3>Remaining</h3>
        <p>{{ remaining }}</p>
    </div>

</div>

<a href="/add-expense">Add Expense</a>
<a href="/reset" onclick="return confirm('Are you sure?')">
    Reset Budget
</a>

{% endblock %}
